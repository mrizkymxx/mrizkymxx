name: generate-snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: mrizkymxx
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit snake
        run: |
          git config user.name "Muhammad Rizky"
          git config user.email "mrizkymxx@users.noreply.github.com"
          git add -f dist/
          git commit -m "snake: regenerate contribution grid" || exit 0
          git push